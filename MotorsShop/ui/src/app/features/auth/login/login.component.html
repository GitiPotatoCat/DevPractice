<!-- login.component.html -->
<div class="card auth-card">
    <h1>Log in</h1>

    @if (resetSuccess()) {
        <p class="success">Password reset successful. You can log in with your new password.</p>
    }

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <label>
            Email
            <input type="email" formControlName="email" autocomplete="email" />
            @if (form.controls.email.touched && form.controls.email.errors) {
            <p class="error">Enter a valid email.</p>
            }
        </label>

        <label>
            Password
            <input type="password" formControlName="password" autocomplete="current-password" />
            @if (form.controls.password.touched && form.controls.password.errors) {
            <p class="error">Password is required.</p>
            }
        </label>

        <a routerLink="/forgot-password" class="forgot-link muted">Forgot password?</a>

        @if (errorMessage()) {
        <p class="error">{{ errorMessage() }}</p>
        }

        <button type="submit" class="primary" [disabled]="form.invalid || isSubmitting()">
            {{ isSubmitting() ? 'Logging in...' : 'Log in' }}
        </button>
    </form>

    <p class="muted">
        Don't have an account? <a routerLink="/register">Register</a>
    </p>
</div>
