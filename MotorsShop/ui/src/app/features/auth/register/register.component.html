<!-- register.component.html -->
<div class="card auth-card">
    <h1>Create account</h1>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <label>
            Full name
            <input type="text" formControlName="fullName" autocomplete="name" />
            @if (form.controls.fullName.touched && form.controls.fullName.invalid) {
            <p class="error">At least 2 characters required.</p>
            }
        </label>

        <label>
            Email
            <input type="email" formControlName="email" autocomplete="email" />
            @if (form.controls.email.touched && form.controls.email.invalid) {
            <p class="error">Enter a valid email.</p>
            }
        </label>

        <label>
            Password
            <input type="password" formControlName="password" autocomplete="new-password" />
            @if (form.controls.password.touched && form.controls.password.invalid) {
            <p class="error">At least 8 characters required.</p>
            }
        </label>

        @if (fieldErrors() | keyvalue; as errors) {
        @for (entry of errors; track entry.key) {
        @for (msg of entry.value; track msg) {
        <p class="error">{{ msg }}</p>
        }
        }
        }

        @if (errorMessage()) {
        <p class="error">{{ errorMessage() }}</p>
        }

        <button type="submit" class="primary" [disabled]="form.invalid || isSubmitting()">
            {{ isSubmitting() ? 'Creating account...' : 'Register' }}
        </button>
    </form>

    <p class="muted">
        Already have an account? <a routerLink="/login">Log in</a>
    </p>
</div>
