<!-- forgot-password.component.html -->
<div class="card auth-card">
    <h1>Forgot Password</h1>

    <p class="muted">
        Enter the email associated with your account. We'll send you a link to reset your password.
    </p>

    @if (successMessage()) {
    <p class="success">{{ successMessage() }}</p>
    }

    <form [formGroup]="form" (ngSubmit)="submit()">
        <label>
            Email
            <input type="email" formControlName="email" autocomplete="email" />
            @if (form.controls.email.touched && form.controls.email.invalid) {
            <p class="error">Enter a valid email.</p>
            }
        </label>

        @if (errorMessage()) {
        <p class="error">{{ errorMessage() }}</p>
        }

        <button type="submit" class="primary" [disabled]="form.invalid || isSubmitting()">
            {{ isSubmitting() ? 'Sending...' : 'Send reset link' }}
        </button>
    </form>

    <p class="muted">
        Remembered? <a routerLink="/login">Log in</a>
    </p>
</div>
